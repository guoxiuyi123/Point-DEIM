__include__: [
  '../../DEIM/configs/dfine/dfine_hgnetv2_n_custom.yml'
]

output_dir: outputs/visdrone2019_full_box

num_classes: 10
remap_mscoco_category: False

epoches: 120
flat_epoch: 60
no_aug_epoch: 15
lr_gamma: 0.1

train_dataloader:
  total_batch_size: 16
  num_workers: 4
  dataset:
    type: CocoDetection
    img_folder: dataset/visdrone2019/images/train
    ann_file: dataset/visdrone2019/annotations/instances_train.json
    transforms:
      policy:
        epoch: 112
  collate_fn:
    stop_epoch: 112

val_dataloader:
  total_batch_size: 8
  num_workers: 4
  dataset:
    type: CocoDetection
    img_folder: dataset/visdrone2019/images/val
    ann_file: dataset/visdrone2019/annotations/instances_val.json
