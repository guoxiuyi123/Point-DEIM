__include__: [
  '../../DEIM/configs/dfine/dfine_hgnetv2_n_custom.yml'
]

output_dir: outputs/visdrone2019_point_only_ptteacher

num_classes: 10
remap_mscoco_category: False

epoches: 140
flat_epoch: 80
no_aug_epoch: 20
lr_gamma: 0.1

criterion: PointSupDEIMCriterionScaleAdaptiveInitScoreThreshSchedule

PointSupDEIMCriterionScaleAdaptiveInitScoreThreshSchedule:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5, loss_point: 1.0}
  losses: ['vfl', 'boxes', 'local', 'point']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
  update_topk: 7
  update_use_aux_outputs: True
  update_use_enc_aux_outputs: False
  update_use_pre_outputs: False
  update_burnin_epochs: 4
  reg_quality_weight: cls_score
  reg_quality_power: 1.0
  pseudo_box:
    prior_wh: 0.03
    min_wh: 0.005
    max_wh: 0.85
    ema: 0.90
    score_thresh: 0.20
    center_radius: 0.02
    class_agnostic_warmup_epochs: 4
    require_point_inside: True
    max_scale_up: 1.6
    max_scale_down: 0.2
    aggregate_by_target: True
    score_weight_power: 1.0
    score_topk: 7
    score_topk_begin_epoch: 0
    score_topk_end_epoch: 10
    refine_points: True
    refine_lamda: 0.5
    refine_begin_epoch: 0
    refine_end_epoch: 30
  adaptive_k: 1
  adaptive_scale: 0.15
  score_thresh_start: 0.40
  score_thresh_end: 0.20
  score_thresh_begin_epoch: 0
  score_thresh_end_epoch: 80
  center_radius_start: 0.08
  center_radius_end: 0.02
  center_radius_begin_epoch: 0
  center_radius_end_epoch: 60
  max_scale_up_start: 2.5
  max_scale_up_end: 1.6
  max_scale_up_begin_epoch: 0
  max_scale_up_end_epoch: 60

train_dataloader:
  total_batch_size: 16
  num_workers: 4
  dataset:
    type: CocoPointDetection
    img_folder: dataset/visdrone2019/images/train
    ann_file: dataset/visdrone2019/annotations/instances_train.json
    point_mode: center
    drop_boxes: True
    prior_wh: 0.03
    min_wh: 0.005
    max_wh: 0.85
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: RandomErasing, p: 0.5, scale: [0.02, 0.20], ratio: [0.3, 3.3], value: 0}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: 120
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomErasing']
  collate_fn:
    stop_epoch: 120

val_dataloader:
  total_batch_size: 8
  num_workers: 4
  dataset:
    type: CocoDetection
    img_folder: dataset/visdrone2019/images/val
    ann_file: dataset/visdrone2019/annotations/instances_val.json
