__include__:
- ../mutilmodality/dfine_hgnetv2_n_mm_runtime_only.yml
output_dir: ./outputs/afss_training/dfine_hgnetv2_n_mm_runtime_only_afss
train_dataloader:
  dataset:
    type: AFSSDataset
    dataset:
      type: MultimodalCocoDetection
      img_folder: /root/code/project/DEIM-MutilModel-Dataset/FLIR_v1_align/converted/rgb/train
      npy_folder: /root/code/project/DEIM-MutilModel-Dataset/FLIR_v1_align/converted/preview_npy/train
      ann_file: /root/code/project/DEIM-MutilModel-Dataset/FLIR_v1_align/converted/annotations/instances_train_rgb.json
      return_masks: false
      npy_size_mismatch: error
      transforms:
        type: MultimodalCompose
        ops:
        - type: RandomPhotometricDistort
          p: 0.5
        - type: RandomZoomOut
          fill: 0
        - type: RandomIoUCrop
          p: 0.8
        - type: SanitizeBoundingBoxes
          min_size: 1
        - type: RandomHorizontalFlip
        - type: Resize
          size:
          - 640
          - 640
        - type: SanitizeBoundingBoxes
          min_size: 1
        - type: ConvertPILImage
          dtype: float32
          scale: true
        - type: NormalizeNPYMinMax
        - type: ConvertBoxes
          fmt: cxcywh
          normalize: true
        policy:
          name: stop_epoch
          epoch: 148
          ops:
          - RandomPhotometricDistort
          - RandomZoomOut
          - RandomIoUCrop
        mosaic_prob: 0.5
afss_update_dataloader:
  type: DataLoader
  dataset:
    type: MultimodalCocoDetection
    img_folder: /root/code/project/DEIM-MutilModel-Dataset/FLIR_v1_align/converted/rgb/train
    npy_folder: /root/code/project/DEIM-MutilModel-Dataset/FLIR_v1_align/converted/preview_npy/train
    ann_file: /root/code/project/DEIM-MutilModel-Dataset/FLIR_v1_align/converted/annotations/instances_train_rgb.json
    return_masks: false
    npy_size_mismatch: error
    transforms:
      type: MultimodalCompose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: NormalizeNPYMinMax
  shuffle: false
  num_workers: 4
  drop_last: false
  pin_memory: true
  collate_fn:
    type: BatchMultimodalCollateFunction
  total_batch_size: 4
AFSS:
  enabled: true
  dump_refresh_json: false
  easy_threshold: 0.85
  moderate_threshold: 0.55
  easy_ratio: 0.02
  moderate_ratio: 0.4
  easy_review_gap: 10
  moderate_gap: 3
  update_interval: 5
  warmup_epochs: 5
  review_force_cap_ratio: 0.5
  iou_threshold: 0.5
  conf_threshold: 0.25
  random_seed: 0
