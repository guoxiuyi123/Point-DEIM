__include__: [
  '../../DEIM/configs/dfine/dfine_hgnetv2_n_custom.yml'
]

output_dir: outputs/nwpu_vhr10_point_only_enhanced

num_classes: 10
remap_mscoco_category: False

epoches: 140
flat_epoch: 80
no_aug_epoch: 20
lr_gamma: 0.1

criterion: PointSupDEIMCriterionV2

PointSupDEIMCriterionV2:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5, loss_point: 1.0}
  losses: ['vfl', 'boxes', 'local', 'point']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
  pseudo_box:
    memory_size: 3
    prior_wh: 0.20
    min_wh: 0.015
    score_thresh: 0.15
    center_radius: 0.10
    class_agnostic_warmup_epochs: 10
    density_recall_penalty: 1.5
    density_precision_penalty: 1.1
    mask_point_sample_ratio: 8

train_dataloader:
  total_batch_size: 16
  num_workers: 4
  dataset:
    type: CocoPointDetection
    img_folder: dataset/nwpu_vhr10/images/train
    ann_file: dataset/nwpu_vhr10/annotations/instances_train.json
    transforms:
      policy:
        epoch: 120
    point_mode: center
    drop_boxes: True
    prior_wh: 0.20
    min_wh: 0.015
    max_wh: 0.90
  collate_fn:
    stop_epoch: 120

val_dataloader:
  total_batch_size: 8
  num_workers: 4
  dataset:
    type: CocoDetection
    img_folder: dataset/nwpu_vhr10/images/val
    ann_file: dataset/nwpu_vhr10/annotations/instances_val.json
