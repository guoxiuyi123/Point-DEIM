__include__: [
  '../../../DEIM/configs/dfine/dfine_hgnetv2_n_custom.yml'
]

# 建议修改输出目录名称，方便与全监督区分
output_dir: outputs/nwpu_vhr10_point_only_enhanced

num_classes: 10
remap_mscoco_category: False

# ================= 🚀 核心优化修改区 =================
epoches: 140           # 点监督必须拉长生命周期！从 60 轮大幅提升至 140 轮
flat_epoch: 80         # 给伪框生成机制（Pseudo Box Generation）留出前 80 轮进行高强度高学习率探索
no_aug_epoch: 20       # 最后 20 轮完全关闭强数据增强，让伪框在稳定真实的遥感背景下进行极致微调
lr_gamma: 0.1
# ===================================================

criterion: PointSupDEIMCriterionV2

PointSupDEIMCriterionV2:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5, loss_point: 1.0}
  losses: ['vfl', 'boxes', 'local', 'point']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
  pseudo_box:
    memory_size: 3
    # 核心点监督微调：将伪框预热轮数稍微拉长（原为 4），给类别无关的几何粗定位更多时间稳定
    class_agnostic_warmup_epochs: 6  
    density_recall_penalty: 1.1
    density_precision_penalty: 1.3
    mask_point_sample_ratio: 8

train_dataloader:
  total_batch_size: 16
  num_workers: 4
  dataset:
    type: CocoPointDetection
    img_folder: dataset/nwpu_vhr10/images/train
    ann_file: dataset/nwpu_vhr10/annotations/instances_train.json
    transforms:
      policy:
        epoch: 120     # 同步修改：总轮数 140 - no_aug_epoch 20 = 120 轮时切换策略
    point_mode: center
    drop_boxes: True
    prior_wh: 0.20
    min_wh: 0.02
    max_wh: 0.90
  collate_fn:
    stop_epoch: 120    # 同步修改：必须与上面 transforms 的 epoch 保持绝对一致

val_dataloader:
  total_batch_size: 8
  num_workers: 4
  dataset:
    type: CocoDetection
    img_folder: dataset/nwpu_vhr10/images/val
    ann_file: dataset/nwpu_vhr10/annotations/instances_val.json