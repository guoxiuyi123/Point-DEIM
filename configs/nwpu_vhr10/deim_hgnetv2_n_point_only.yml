__include__: [
  '../../DEIM/configs/dfine/dfine_hgnetv2_n_custom.yml'
]

output_dir: outputs/nwpu_vhr10_point_only_fullscale

num_classes: 10
remap_mscoco_category: False

epoches: 140
flat_epoch: 80
no_aug_epoch: 20
lr_gamma: 0.1

DFINETransformer:
  return_attn_centers: True

criterion: PointSupDEIMCriterionScaleAdaptiveInitScoreThreshSchedule

PointSupDEIMCriterionScaleAdaptiveInitScoreThreshSchedule:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5, loss_point: 1.0}
  losses: ['vfl', 'boxes', 'local', 'point']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  dino_semantic_enable: True
  dino_semantic_ckpt: weight/dinov2/dinov2_vits14_reg4_pretrain.pth
  dino_semantic_mode: point_sim
  dino_semantic_weight: 2.0
  dino_semantic_input_size: 560
  dino_semantic_max_boxes: 64
  dino_semantic_tau: 0.02
  dino_semantic_sim_thresh: 0.65
  dino_semantic_min_mask: 4
  dino_semantic_min_wh: 0.01
  dino_semantic_interval: 1
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
  density_area_aware: True
  density_area_low: 0.0025
  density_area_high: 0.09
  density_area_reduce: median
  density_recall_penalty_mult_small: 1.5
  density_recall_penalty_mult_large: 0.8
  density_precision_penalty_mult_small: 1.5
  density_precision_penalty_mult_large: 0.8
  update_topk: 7
  update_use_aux_outputs: True
  update_use_enc_aux_outputs: False
  update_use_pre_outputs: False
  update_burnin_epochs: 4
  reg_quality_weight: cls_score
  reg_quality_power: 1.0
  pseudo_box:
    prior_wh: 0.05
    min_wh: 0.005
    max_wh: 0.90
    ema: 0.90
    
    # ==============================================================
    # 🌟 修复区：加回限制框膨胀的物理底线，彻底杜绝 NaN 梯度爆炸！
    score_thresh: 0.20
    density_recall_penalty: 1.5       # 兜底：防止小目标漏掉特征
    density_precision_penalty: 1.35   # 紧箍咒：死死勒住边界，绝对不许向背景膨胀！
    # ==============================================================
    
    center_radius: 0.02
    class_agnostic_warmup_epochs: 4
    require_point_inside: True
    require_point_inside_by_area: True
    require_point_inside_area_thresh: 0.01
    max_scale_up: 1.6
    max_scale_down: 0.2
    area_aware: True
    area_aware_low: 0.0025
    area_aware_high: 0.09
    center_radius_mult_small: 0.7
    center_radius_mult_large: 1.5
    max_scale_up_mult_small: 0.8
    max_scale_up_mult_large: 1.3
    max_scale_down_mult_small: 2.0
    max_scale_down_mult_large: 0.5
    aggregate_by_target: True
    score_weight_power: 1.0
    score_topk: 7
    score_topk_begin_epoch: 0
    score_topk_end_epoch: 140
    refine_points: True
    refine_lamda: 0.5
    refine_points_by: attn_center
    refine_begin_epoch: 0
    refine_end_epoch: 30
  adaptive_k: 1
  adaptive_scale: 0.20
  score_thresh_start: 0.40
  score_thresh_end: 0.20
  score_thresh_begin_epoch: 0
  score_thresh_end_epoch: 80
  center_radius_start: 0.08
  center_radius_end: 0.02
  center_radius_begin_epoch: 0
  center_radius_end_epoch: 60
  max_scale_up_start: 2.5
  max_scale_up_end: 1.6
  max_scale_up_begin_epoch: 0
  max_scale_up_end_epoch: 60

train_dataloader:
  total_batch_size: 16
  num_workers: 4
  dataset:
    type: CocoPointDetection
    img_folder: dataset/nwpu_vhr10/images/train
    ann_file: dataset/nwpu_vhr10/annotations/instances_train.json
    point_mode: center
    drop_boxes: True
    prior_wh: 0.05
    min_wh: 0.005
    max_wh: 0.90
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: PointAwareCopyPaste, p: 0.5, max_paste: 3, max_area_ratio: 0.01, bbox_pad: 0, max_iou: 0.1, max_trials: 50}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: RandomErasing, p: 0.5, scale: [0.02, 0.20], ratio: [0.3, 3.3], value: 0}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: 120
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomErasing']
  collate_fn:
    stop_epoch: 120

val_dataloader:
  total_batch_size: 8
  num_workers: 4
  dataset:
    type: CocoDetection
    img_folder: dataset/nwpu_vhr10/images/val
    ann_file: dataset/nwpu_vhr10/annotations/instances_val.json
