__include__: [
  './deim_hgnetv2_n_point_only.yml'
]

output_dir: outputs/nwpu_vhr10_point_only_sa_init

criterion: PointSupDEIMCriterionScaleAdaptiveInit

PointSupDEIMCriterionScaleAdaptiveInit:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5, loss_point: 1.0}
  losses: ['vfl', 'boxes', 'local', 'point']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
  pseudo_box:
    class_agnostic_warmup_epochs: 4
    score_thresh: 0.3
    center_radius: 0.08
  adaptive_k: 1
  adaptive_scale: 0.6
